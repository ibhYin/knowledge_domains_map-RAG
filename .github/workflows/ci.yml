name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    name: 后端离线回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 启动脚本语法检查
        run: |
          bash -n start.sh
          bash -n scripts/restart.sh
      - name: 离线回归检查（51 项，假模型 + 临时目录）
        run: PYTHONPATH=src python tests/review_checks.py

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
