<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphRAG 控制台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f4f6; color: #1f2937; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .card h2 { font-size: 15px; margin: 0 0 12px; color: #374151; }
    .status-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; }
    .dot.running { background: #22c55e; }
    .meta { color: #6b7280; font-size: 12px; margin-top: 8px; }
    label { display: block; font-size: 13px; color: #374151; margin: 10px 0 4px; }
    input[type=text], input[type=password] { width: 100%; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button { border: none; border-radius: 6px; padding: 9px 18px; font-size: 14px; cursor: pointer; }
    .primary { background: #2563eb; color: #fff; }
    .success { background: #16a34a; color: #fff; }
    .danger { background: #dc2626; color: #fff; }
    .ghost { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
    #msg.ok { color: #16a34a; }
    #msg.err { color: #dc2626; }
    pre { background: #111827; color: #d1d5db; border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.5; height: 240px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    .hint { color: #9ca3af; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>GraphRAG 控制台</h1>
    <div class="sub">在此配置 LLM 并一键启停系统。系统运行后点击「打开系统」进入问答界面。</div>

    <div class="card">
      <h2>系统状态</h2>
      <div class="status-row">
        <span id="dot" class="dot"></span>
        <span id="statusText">检测中…</span>
      </div>
      <div class="meta" id="statusMeta"></div>
      <div class="btns">
        <button class="success" id="btnStart" onclick="startSys()">启动系统</button>
        <button class="danger" id="btnStop" onclick="stopSys()">停止系统</button>
        <button class="ghost" id="btnRestart" onclick="restartSys()">重启</button>
        <button class="ghost" id="btnOpen" onclick="openApp()">打开系统 →</button>
        <button class="ghost" onclick="quitAll()">退出控制台</button>
      </div>
      <div id="msg"></div>
    </div>

    <div class="card">
      <h2>LLM 配置</h2>
      <label>请求地址 base_url（OpenAI 兼容端点）</label>
      <input type="text" id="baseUrl" placeholder="https://xxx/v1" />
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="留空表示保持不变" autocomplete="off" />
      <div class="hint" id="keyHint"></div>
      <label>模型名称</label>
      <input type="text" id="model" placeholder="例如 gpt-4o-mini / deepseek-chat / qwen-max" />
      <div class="btns">
        <button class="primary" onclick="saveSettings()">保存设置</button>
      </div>
    </div>

    <div class="card">
      <h2>后端日志</h2>
      <pre id="logs">（暂无日志）</pre>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let pollTimer = null;

    async function api(path, method = "GET", body = null) {
      const opts = { method };
      if (body) { opts.headers = { "Content-Type": "application/json" }; opts.body = JSON.stringify(body); }
      const r = await fetch(path, opts);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || r.statusText);
      return data;
    }

    function showMsg(text, ok = true) {
      $("msg").textContent = text;
      $("msg").className = ok ? "ok" : "err";
      setTimeout(() => ($("msg").textContent = ""), 4000);
    }

    async function refresh() {
      try {
        const s = await api("/api/status");
        const running = s.backend_running && s.backend_ready;
        $("dot").className = "dot" + (running ? " running" : "");
        $("statusText").textContent = running
          ? "系统运行中"
          : s.backend_running ? "系统启动中…" : "系统已停止";
        $("statusMeta").textContent = running
          ? `PID ${s.backend_pid} · 端口 ${s.backend_port} · 地址 ${s.app_url}`
          : "点击「启动系统」开始使用";
        $("btnStart").disabled = running;
        $("btnStop").disabled = !s.backend_running;
        $("btnRestart").disabled = !s.backend_running;
      } catch (e) {
        $("statusText").textContent = "控制台异常：" + e.message;
      }
      try {
        const l = await api("/api/logs?n=100");
        const el = $("logs");
        if (l.logs) { el.textContent = l.logs; el.scrollTop = el.scrollHeight; }
      } catch (e) { /* ignore */ }
    }

    async function loadSettings() {
      try {
        const s = await api("/api/settings");
        $("baseUrl").value = s.openai_base_url || "";
        $("model").value = s.openai_model || "";
        $("keyHint").textContent = s.api_key_set ? "已设置 API Key（留空保持不变）" : "尚未设置 API Key";
      } catch (e) { showMsg("读取设置失败：" + e.message, false); }
    }

    async function saveSettings() {
      const body = {
        openai_base_url: $("baseUrl").value,
        openai_model: $("model").value,
        openai_api_key: $("apiKey").value,
      };
      try {
        const r = await api("/api/settings", "POST", body);
        $("apiKey").value = "";
        showMsg(r.message);
        loadSettings();
      } catch (e) { showMsg("保存失败：" + e.message, false); }
    }

    async function startSys() {
      $("btnStart").disabled = true;
      try {
        const r = await api("/api/start", "POST", {});
        showMsg(r.message);
        refresh();
        openApp();
      } catch (e) { showMsg("启动失败：" + e.message, false); }
    }

    async function stopSys() {
      try {
        const r = await api("/api/stop", "POST", {});
        showMsg(r.message);
        refresh();
      } catch (e) { showMsg("停止失败：" + e.message, false); }
    }

    async function restartSys() {
      try {
        const r = await api("/api/restart", "POST", {});
        showMsg(r.message);
        refresh();
      } catch (e) { showMsg("重启失败：" + e.message, false); }
    }

    function openApp() {
      api("/api/status").then((s) => { if (s.app_url) window.open(s.app_url, "_blank"); });
    }

    async function quitAll() {
      if (!confirm("确定退出控制台？系统服务也会一并停止。")) return;
      try { await api("/api/stop", "POST", {}); } catch (e) {}
      try { await api("/api/quit", "POST", {}); } catch (e) {}
      showMsg("控制台已退出，可以关闭此页面");
    }

    loadSettings();
    refresh();
    pollTimer = setInterval(refresh, 3000);
  </script>
</body>
</html>
