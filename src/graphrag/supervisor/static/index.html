<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphRAG 控制台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f1f5f9; color: #0f172a; font-size: 14px; line-height: 1.6; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; flex-shrink: 0; background: linear-gradient(180deg, #111c33 0%, #0f172a 100%); color: #cbd5e1; padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; border-bottom: 1px solid rgba(148,163,184,.15); }
    .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; }
    .brand .t1 { color: #fff; font-size: 15px; font-weight: 600; }
    .brand .t2 { color: #64748b; font-size: 11px; }
    .nav-label { padding: 8px 12px; border-radius: 8px; font-size: 13.5px; }
    .nav-label.active { background: #4f46e5; color: #fff; }
    .nav-label.muted { color: #64748b; }
    .main { flex: 1; padding: 28px 32px; max-width: 980px; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
    .desc { color: #475569; margin: 0 0 20px; font-size: 13.5px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 1px 3px rgba(15,23,42,.08); padding: 20px; margin-bottom: 16px; }
    .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
    .status-row { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; }
    .dot.running { background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.15); }
    .meta { color: #64748b; font-size: 12.5px; margin-top: 8px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .btn { border: none; border-radius: 8px; padding: 9px 18px; font-size: 13.5px; cursor: pointer; font-weight: 500; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-ghost { background: #fff; color: #475569; border: 1px solid #e2e8f0; }
    .btn-primary { background: #4f46e5; color: #fff; }
    label { display: block; font-size: 13px; color: #475569; margin: 12px 0 6px; font-weight: 500; }
    input[type=text], input[type=password] { width: 100%; padding: 9px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .hint { color: #94a3b8; font-size: 12px; margin-top: 4px; }
    #msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
    #msg.ok { color: #16a34a; }
    #msg.err { color: #dc2626; }
    pre { background: #0f172a; color: #cbd5e1; border-radius: 10px; padding: 14px; font-size: 12px; line-height: 1.5; height: 260px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; margin: 0; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">G</div>
        <div>
          <div class="t1">GraphRAG 控制台</div>
          <div class="t2">LLM 配置与启停</div>
        </div>
      </div>
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:2px">
        <div class="nav-label active">系统控制</div>
        <a class="nav-label muted" href="http://localhost:8002" target="_blank" style="text-decoration:none">问答系统 →</a>
      </div>
    </aside>
    <main class="main">
      <h1>系统控制</h1>
      <p class="desc">配置 LLM 并一键启动 / 停止问答系统。配置保存后立即生效。</p>

      <div class="card">
        <h2>系统状态</h2>
        <div class="status-row"><span id="dot" class="dot"></span><span id="statusText">检测中…</span></div>
        <div class="meta" id="statusMeta"></div>
        <div class="btn-row">
          <button class="btn btn-success" id="btnStart" onclick="startSys()">启动系统</button>
          <button class="btn btn-danger" id="btnStop" onclick="stopSys()">停止系统</button>
          <button class="btn btn-ghost" id="btnRestart" onclick="restartSys()">重启</button>
          <button class="btn btn-primary" id="btnOpen" onclick="openApp()">打开问答系统 →</button>
          <button class="btn btn-ghost" onclick="quitAll()">退出控制台</button>
        </div>
        <div id="msg"></div>
      </div>

      <div class="card">
        <h2>LLM 配置</h2>
        <label>请求地址 base_url</label>
        <input type="text" id="baseUrl" placeholder="https://xxx/v1" />
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="留空表示保持不变" autocomplete="off" />
        <div class="hint" id="keyHint"></div>
        <label>模型名称</label>
        <input type="text" id="model" placeholder="例如 gpt-4o-mini / deepseek-chat / qwen-max" />
        <div class="btn-row"><button class="btn btn-primary" onclick="saveSettings()">保存设置</button></div>
      </div>

      <div class="card">
        <h2>后端日志</h2>
        <pre id="logs">（暂无日志）</pre>
      </div>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let pollTimer = null;

    async function api(path, method = "GET", body = null) {
      const opts = { method };
      if (body) { opts.headers = { "Content-Type": "application/json" }; opts.body = JSON.stringify(body); }
      const r = await fetch(path, opts);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || r.statusText);
      return data;
    }

    function showMsg(text, ok = true) {
      $("msg").textContent = text;
      $("msg").className = ok ? "ok" : "err";
      setTimeout(() => ($("msg").textContent = ""), 4000);
    }

    async function refresh() {
      try {
        const s = await api("/api/status");
        const running = s.backend_running && s.backend_ready;
        $("dot").className = "dot" + (running ? " running" : "");
        $("statusText").textContent = running ? "问答系统运行中" : s.backend_running ? "系统启动中…" : "问答系统已停止";
        $("statusMeta").textContent = running ? `PID ${s.backend_pid} · 端口 ${s.backend_port} · ${s.app_url}` : "点击「启动系统」开始使用";
        $("btnStart").disabled = running;
        $("btnStop").disabled = !s.backend_running;
        $("btnRestart").disabled = !s.backend_running;
      } catch (e) {
        $("statusText").textContent = "控制台异常：" + e.message;
      }
      try {
        const l = await api("/api/logs?n=100");
        const el = $("logs");
        if (l.logs) { el.textContent = l.logs; el.scrollTop = el.scrollHeight; }
      } catch (e) {}
    }

    async function loadSettings() {
      try {
        const s = await api("/api/settings");
        $("baseUrl").value = s.openai_base_url || "";
        $("model").value = s.openai_model || "";
        $("keyHint").textContent = s.api_key_set ? "已设置 API Key（留空保持不变）" : "尚未设置 API Key";
      } catch (e) { showMsg("读取设置失败：" + e.message, false); }
    }

    async function saveSettings() {
      try {
        const r = await api("/api/settings", "POST", { openai_base_url: $("baseUrl").value, openai_model: $("model").value, openai_api_key: $("apiKey").value });
        $("apiKey").value = "";
        showMsg(r.message);
        loadSettings();
      } catch (e) { showMsg("保存失败：" + e.message, false); }
    }

    async function startSys() {
      $("btnStart").disabled = true;
      try {
        const r = await api("/api/start", "POST", {});
        showMsg(r.message);
        refresh();
        openApp();
      } catch (e) { showMsg("启动失败：" + e.message, false); }
    }
    async function stopSys() { try { const r = await api("/api/stop", "POST", {}); showMsg(r.message); refresh(); } catch (e) { showMsg("停止失败：" + e.message, false); } }
    async function restartSys() { try { const r = await api("/api/restart", "POST", {}); showMsg(r.message); refresh(); } catch (e) { showMsg("重启失败：" + e.message, false); } }

    function openApp() { api("/api/status").then((s) => { if (s.app_url) window.open(s.app_url, "_blank"); }); }

    async function quitAll() {
      if (!confirm("确定退出控制台？问答系统也会一并停止。")) return;
      try { await api("/api/stop", "POST", {}); } catch (e) {}
      try { await api("/api/quit", "POST", {}); } catch (e) {}
      showMsg("控制台已退出，可以关闭此页面");
    }

    loadSettings();
    refresh();
    pollTimer = setInterval(refresh, 3000);
  </script>
</body>
</html>
